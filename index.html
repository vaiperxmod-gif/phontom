```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VaiperX Panel</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

.ui {
    position: relative;

    width: 100vw;
    height: 100vh;

    max-width: 600px;

    background-image: url("https://i.postimg.cc/fLM5jYkf/3639e376-31c1-438f-bf76-5b6c02a314a4.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

.hotspot {
    position: absolute;

    left: 7%;
    width: 86%;
    height: 7.8%;

    border-radius: 30px;

    background: rgba(255,255,255,0);

    text-decoration: none;

    cursor: pointer;

    transition: all 0.2s ease;

    -webkit-tap-highlight-color: transparent;
}


/* =========================
   ตำแหน่งปุ่ม
========================= */

/* ปุ่ม 1 ขึ้น 3% */
.key {
    top: 46.8%;
}

/* ปุ่ม 2 ลง 1% */
.app {
    top: 60.2%;
}

/* ปุ่ม 3 ลง 3% */
.tutorial {
    top: 71.6%;
}


/* =========================
   เอฟเฟกต์
========================= */

.hotspot::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 30px;

    background: rgba(255,255,255,0.10);

    border: 1px solid rgba(255,255,255,0.35);

    box-shadow:
        0 0 20px rgba(255,255,255,0.25),
        inset 0 0 15px rgba(255,255,255,0.08);

    opacity: 0;

    transition: all 0.2s ease;
}

.hotspot:hover::after {
    opacity: 1;
}

.hotspot:active {
    transform: scale(0.97);
}

.hotspot:active::after {
    opacity: 1;

    background: rgba(255,255,255,0.16);

    box-shadow:
        0 0 35px rgba(255,255,255,0.7),
        inset 0 0 20px rgba(255,255,255,0.2);
}


/* =========================
   Responsive
========================= */

@media (max-width: 600px) {

    .ui {
        width: 100vw;
        height: 100vh;

        background-size: cover;
        background-position: center;
    }

}
</style>
</head>

<body>

<div class="ui">

    <!-- ปุ่ม 1 : เว็บยืนยันคีย์ -->
    <a
        class="hotspot key"
        href="https://client.nulldash.store/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="เว็บยืนยันคีย์">
    </a>


    <!-- ปุ่ม 2 : ลิ้งแอป -->
    <a
        class="hotspot app"
        href="https://apps.apple.com/th/app/happ-proxy-utility/id6504287215?l=th"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="ลิ้งแอป">
    </a>


    <!-- ปุ่ม 3 : คลิปสอนลงและใช้งาน -->
    <a
        class="hotspot tutorial"
        href="#"
        aria-label="คลิปสอนลงและใช้งาน">
    </a>

</div>

</body>
</html>
```
