<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#030303">

<title>VAIPERX PANEL</title>


<style>

/* =========================================================
   VAIPERX PREMIUM CYBER PANEL
   BLACK / RED / FILLED ICON
========================================================= */


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100%;
    height: 100%;

}

body {

    overflow: hidden;

    background: #020202;

    color: #ffffff;

    font-family:
        Arial,
        "Noto Sans Thai",
        "Tahoma",
        sans-serif;

}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    position: relative;

    width: 100%;

    height: 100dvh;

    min-height: 100vh;

    overflow: hidden;

    display: flex;

    justify-content: center;

    align-items: center;

    background:

        radial-gradient(
            ellipse at 50% -10%,
            rgba(255, 0, 45, 0.25),
            transparent 42%
        ),

        radial-gradient(
            ellipse at 0% 100%,
            rgba(180, 0, 30, 0.16),
            transparent 38%
        ),

        radial-gradient(
            ellipse at 100% 70%,
            rgba(255, 0, 50, 0.12),
            transparent 36%
        ),

        linear-gradient(
            145deg,
            #010101 0%,
            #090909 48%,
            #020202 100%
        );

}


/* =========================================================
   CYBER GRID
========================================================= */

.grid {

    position: absolute;

    inset: -100px;

    opacity: 0.22;

    background-image:

        linear-gradient(
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,0.035) 1px,
            transparent 1px
        );

    background-size:
        42px 42px;

    transform:
        perspective(500px)
        rotateX(58deg)
        scale(1.7);

    transform-origin:
        center bottom;

    mask-image:
        linear-gradient(
            to top,
            black,
            transparent 75%
        );

    pointer-events: none;

}


/* =========================================================
   LARGE RED ORB
========================================================= */

.red-orb {

    position: absolute;

    width: 520px;
    height: 520px;

    left: 50%;
    top: 18%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,0,45,0.18) 0%,
            rgba(255,0,45,0.07) 28%,
            transparent 68%
        );

    filter:
        blur(10px);

    animation:
        orbPulse 5s ease-in-out infinite;

    pointer-events: none;

}


@keyframes orbPulse {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(0.95);
        opacity: 0.7;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.08);
        opacity: 1;
    }

}


/* =========================================================
   DECORATIVE RINGS
========================================================= */

.ring {

    position: absolute;

    left: 50%;
    top: 30%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(255, 0, 40, 0.09);

    pointer-events: none;

}


.ring-1 {

    width: 390px;
    height: 390px;

}


.ring-2 {

    width: 620px;
    height: 620px;

    border-color:
        rgba(255,255,255,0.025);

}


.ring-3 {

    width: 850px;
    height: 850px;

    border-color:
        rgba(255,0,40,0.045);

}


/* =========================================================
   SCAN LINE
========================================================= */

.scan-line {

    position: absolute;

    left: 0;

    width: 100%;

    height: 1px;

    top: -10%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,0,45,0.5),
            transparent
        );

    box-shadow:
        0 0 12px
        rgba(255,0,45,0.35);

    animation:
        scan 8s linear infinite;

    pointer-events: none;

}


@keyframes scan {

    0% {
        top: -10%;
    }

    100% {
        top: 110%;
    }

}


/* =========================================================
   PARTICLES
========================================================= */

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #ff1739;

    box-shadow:
        0 0 8px #ff1739,
        0 0 16px rgba(255,0,40,0.7);

    animation:
        particleFloat 6s linear infinite;

    pointer-events: none;

}


.p1 {
    left: 8%;
    top: 25%;
}

.p2 {
    left: 18%;
    top: 75%;
    animation-delay: 1s;
}

.p3 {
    left: 86%;
    top: 20%;
    animation-delay: 2s;
}

.p4 {
    left: 92%;
    top: 60%;
    animation-delay: 3s;
}

.p5 {
    left: 45%;
    top: 12%;
    animation-delay: 1.5s;
}

.p6 {
    left: 72%;
    top: 87%;
    animation-delay: 4s;
}

.p7 {
    left: 30%;
    top: 50%;
    animation-delay: 2.5s;
}

.p8 {
    left: 58%;
    top: 65%;
    animation-delay: 3.5s;
}


@keyframes particleFloat {

    0% {
        transform:
            translateY(35px)
            scale(0.5);

        opacity: 0;
    }

    25% {
        opacity: 0.8;
    }

    75% {
        opacity: 0.8;
    }

    100% {
        transform:
            translateY(-80px)
            scale(1.15);

        opacity: 0;
    }

}


/* =========================================================
   SIDE DECORATIONS
========================================================= */

.side-line {

    position: absolute;

    width: 1px;

    height: 32%;

    top: 34%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,0,40,0.55),
            transparent
        );

    box-shadow:
        0 0 10px
        rgba(255,0,40,0.3);

    pointer-events: none;

}


.side-line.left {
    left: 4%;
}

.side-line.right {
    right: 4%;
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 10;

    width:
        min(92%, 520px);

    max-height:
        96vh;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

}


/* =========================================================
   LOGO
========================================================= */

.logo {

    font-family:
        Arial Black,
        Arial,
        sans-serif;

    font-size:
        clamp(42px, 13vw, 72px);

    font-weight:
        1000;

    font-style:
        italic;

    letter-spacing:
        -4px;

    line-height:
        0.85;

    color:
        #f5f5f5;

    -webkit-text-stroke:
        1px #ffffff;

    text-shadow:

        3px 3px 0 #680013,

        6px 6px 0 #210006,

        0 0 12px
        rgba(255,0,45,0.8),

        0 0 35px
        rgba(255,0,45,0.3);

}


.logo span {

    color:
        #ff1739;

    -webkit-text-stroke:
        1px #ff5169;

}


/* =========================================================
   PANEL TITLE
========================================================= */

.panel-title {

    margin-top:
        9px;

    font-size:
        clamp(17px, 4.5vw, 25px);

    font-weight:
        900;

    letter-spacing:
        8px;

    text-align:
        center;

    color:
        #ffffff;

    text-shadow:
        0 0 15px
        rgba(255,0,40,0.55);

}


/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    margin-top:
        9px;

    margin-bottom:
        22px;

    font-size:
        9px;

    letter-spacing:
        3px;

    color:
        #666;

    text-align:
        center;

}


.subtitle span {

    color:
        #ff193b;

}


/* =========================================================
   SECTION HEADER
========================================================= */

.section {

    width: 100%;

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    margin-bottom:
        12px;

}


.section::before,
.section::after {

    content: "";

    height: 1px;

    flex: 1;

}


.section::before {

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,0,40,0.55)
        );

}


.section::after {

    background:
        linear-gradient(
            90deg,
            rgba(255,0,40,0.55),
            transparent
        );

}


.section-label {

    font-size:
        9px;

    letter-spacing:
        3px;

    color:
        #666;

}


/* =========================================================
   BUTTON LIST
========================================================= */

.buttons {

    width: 100%;

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;

}


/* =========================================================
   MENU BUTTON
========================================================= */

.menu-button {

    position:
        relative;

    width:
        100%;

    min-height:
        78px;

    padding:
        10px 15px;

    border-radius:
        21px;

    border:
        1px solid
        rgba(255,255,255,0.13);

    background:

        linear-gradient(
            135deg,
            rgba(35,35,35,0.88),
            rgba(8,8,8,0.94)
        );

    color:
        #fff;

    text-decoration:
        none;

    display:
        flex;

    align-items:
        center;

    cursor:
        pointer;

    overflow:
        hidden;

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.08),

        0 10px 35px
        rgba(0,0,0,0.5);

    transition:
        0.2s ease;

}


/* =========================================================
   BUTTON RED GLOW
========================================================= */

.menu-button::before {

    content: "";

    position:
        absolute;

    left: 0;
    top: 12%;

    width: 3px;
    height: 76%;

    border-radius: 10px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            #ff1739,
            transparent
        );

    box-shadow:
        0 0 14px #ff1739;

}


/* =========================================================
   BUTTON TOP HIGHLIGHT
========================================================= */

.menu-button::after {

    content: "";

    position:
        absolute;

    left: 10%;
    right: 10%;
    top: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.16),
            transparent
        );

}


/* =========================================================
   BUTTON HOVER
========================================================= */

.menu-button:hover {

    transform:
        translateY(-3px);

    border-color:
        rgba(255,23,57,0.65);

    box-shadow:

        0 0 25px
        rgba(255,0,40,0.16),

        inset 0 0 25px
        rgba(255,0,40,0.04),

        0 14px 35px
        rgba(0,0,0,0.6);

}


.menu-button:active {

    transform:
        scale(0.97);

}


/* =========================================================
   FILLED ICON BOX
========================================================= */

.icon-box {

    position:
        relative;

    flex-shrink:
        0;

    width:
        54px;

    height:
        54px;

    margin-right:
        15px;

    border-radius:
        17px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    background:

        linear-gradient(
            145deg,
            #3b3b3b,
            #101010
        );

    border:
        1px solid
        rgba(255,255,255,0.18);

    box-shadow:

        inset 2px 2px 6px
        rgba(255,255,255,0.12),

        inset -3px -3px 7px
        rgba(0,0,0,0.9),

        0 5px 0 #050505,

        0 0 18px
        rgba(255,0,40,0.18);

    transition:
        0.2s ease;

}


.menu-button:hover .icon-box {

    transform:
        translateY(-1px)
        scale(1.05);

    box-shadow:

        inset 2px 2px 6px
        rgba(255,255,255,0.12),

        inset -3px -3px 7px
        rgba(0,0,0,0.9),

        0 5px 0 #050505,

        0 0 25px
        rgba(255,0,40,0.4);

}


/* =========================================================
   SVG FILLED ICON
========================================================= */

.filled-icon {

    width:
        29px;

    height:
        29px;

    fill:
        #ffffff;

    filter:
        drop-shadow(
            0 2px 2px rgba(0,0,0,0.7)
        );

}


/* =========================================================
   BUTTON TEXT
========================================================= */

.button-info {

    flex:
        1;

    min-width:
        0;

}


.button-title {

    font-size:
        clamp(15px, 4.5vw, 19px);

    font-weight:
        900;

    line-height:
        1.25;

    color:
        #ffffff;

}


.button-subtitle {

    margin-top:
        5px;

    font-size:
        8px;

    letter-spacing:
        1.8px;

    color:
        #686868;

}


/* =========================================================
   ARROW
========================================================= */

.arrow {

    flex-shrink:
        0;

    width:
        35px;

    height:
        35px;

    margin-left:
        8px;

    border-radius:
        50%;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    color:
        #ffffff;

    font-size:
        23px;

    background:
        rgba(255,0,40,0.10);

    border:
        1px solid
        rgba(255,0,40,0.35);

    box-shadow:
        0 0 14px
        rgba(255,0,40,0.15);

}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    margin-top:
        17px;

    color:
        #444;

    font-size:
        8px;

    letter-spacing:
        2.5px;

    text-align:
        center;

}


.footer span {

    color:
        #a70b25;

}


/* =========================================================
   POPUP
========================================================= */

.popup-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        9999;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;

    background:
        rgba(0,0,0,0.84);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

}


.popup-overlay.show {

    display:
        flex;

}


/* =========================================================
   POPUP BOX
========================================================= */

.popup {

    position:
        relative;

    width:
        min(92vw, 390px);

    padding:
        30px 22px 22px;

    border-radius:
        25px;

    border:
        1px solid
        rgba(255,255,255,0.16);

    background:

        linear-gradient(
            145deg,
            #181818,
            #050505
        );

    box-shadow:

        0 0 60px
        rgba(255,0,40,0.2),

        inset 0 0 35px
        rgba(255,255,255,0.025);

    transform:
        scale(0.85);

    opacity:
        0;

    transition:
        0.25s ease;

}


.popup-overlay.show .popup {

    transform:
        scale(1);

    opacity:
        1;

}


/* =========================================================
   POPUP RED TOP
========================================================= */

.popup::before {

    content: "";

    position:
        absolute;

    top:
        0;

    left:
        15%;

    width:
        70%;

    height:
        2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff1739,
            transparent
        );

    box-shadow:
        0 0 15px #ff1739;

}


/* =========================================================
   POPUP CLOSE
========================================================= */

.popup-close {

    position:
        absolute;

    top:
        13px;

    right:
        14px;

    width:
        34px;

    height:
        34px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,0.12);

    background:
        rgba(255,255,255,0.05);

    color:
        #777;

    font-size:
        21px;

    cursor:
        pointer;

}


.popup-close:hover {

    color:
        #ffffff;

    border-color:
        rgba(255,0,40,0.5);

}


/* =========================================================
   POPUP TITLE
========================================================= */

.popup-title {

    text-align:
        center;

    font-size:
        23px;

    font-weight:
        900;

    color:
        #fff;

}


.popup-subtitle {

    margin-top:
        7px;

    margin-bottom:
        18px;

    text-align:
        center;

    color:
        #777;

    font-size:
        12px;

}


/* =========================================================
   OS BUTTON
========================================================= */

.os-button {

    width:
        100%;

    min-height:
        61px;

    margin-top:
        11px;

    border-radius:
        17px;

    border:
        1px solid
        rgba(255,255,255,0.15);

    background:

        linear-gradient(
            145deg,
            #303030,
            #0d0d0d
        );

    color:
        #fff;

    font-size:
        17px;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:

        inset 2px 2px 5px
        rgba(255,255,255,0.08),

        inset -3px -3px 7px
        rgba(0,0,0,0.9),

        0 5px 0 #050505;

    transition:
        0.18s ease;

}


.os-button:hover {

    border-color:
        rgba(255,0,40,0.65);

    box-shadow:

        0 0 22px
        rgba(255,0,40,0.2),

        inset 0 0 18px
        rgba(255,0,40,0.06);

    transform:
        translateY(-2px);

}


.os-button:active {

    transform:
        translateY(3px);

}


/* =========================================================
   CANCEL BUTTON
========================================================= */

.cancel-button {

    width:
        100%;

    height:
        44px;

    margin-top:
        16px;

    border:
        0;

    border-radius:
        13px;

    background:
        rgba(255,255,255,0.045);

    color:
        #777;

    font-size:
        13px;

    font-weight:
        700;

    cursor:
        pointer;

}


.cancel-button:hover {

    color:
        #fff;

    background:
        rgba(255,255,255,0.08);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .content {

        width:
            90%;

    }

    .logo {

        font-size:
            49px;

    }

    .panel-title {

        font-size:
            18px;

        letter-spacing:
            6px;

    }

    .subtitle {

        margin-bottom:
            18px;

    }

    .menu-button {

        min-height:
            70px;

        border-radius:
            18px;

        padding:
            8px 13px;

    }

    .icon-box {

        width:
            48px;

        height:
            48px;

        margin-right:
            12px;

    }

    .filled-icon {

        width:
            26px;

        height:
            26px;

    }

    .button-title {

        font-size:
            15px;

    }

    .button-subtitle {

        font-size:
            7px;

    }

    .arrow {

        width:
            32px;

        height:
            32px;

    }

}


/* =========================================================
   SHORT SCREEN
========================================================= */

@media (max-height: 680px) {

    .content {

        transform:
            scale(0.88);

    }

    .buttons {

        gap:
            9px;

    }

    .menu-button {

        min-height:
            63px;

    }

    .footer {

        margin-top:
            9px;

    }

}


/* =========================================================
   VERY SMALL SCREEN
========================================================= */

@media (max-height: 560px) {

    .content {

        transform:
            scale(0.78);

    }

}


/* =========================================================
   SAFE AREA
========================================================= */

@supports (padding: env(safe-area-inset-bottom)) {

    .content {

        padding-bottom:
            env(safe-area-inset-bottom);

    }

}

</style>

</head>

<script>

/* =========================================================
   OPEN POPUP
========================================================= */

function openOSPopup() {

    const popup =
        document.getElementById("osPopup");

    if (!popup) {
        return;
    }

    popup.classList.add("show");

}


/* =========================================================
   CLOSE POPUP
========================================================= */

function closeOSPopup(event) {

    const popup =
        document.getElementById("osPopup");

    if (!popup) {
        return;
    }


    if (
        event &&
        event.target !== event.currentTarget
    ) {

        return;

    }


    popup.classList.remove("show");

}


/* =========================================================
   IOS
========================================================= */

function openIOS() {

    const url =
        "https://apps.apple.com/th/app/happ-proxy-utility/id6504287215?l=th";

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   ANDROID
========================================================= */

function openAndroid() {

    const url =
        "https://play.google.com/store/apps/details?id=com.happproxy&pcampaignid=web_share";

    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   ESC TO CLOSE
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeOSPopup();

        }

    }
);


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function(event) {

        const now =
            Date.now();

        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    {
        passive: false
    }
);

</script>
